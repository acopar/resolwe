name: Build Docker Images

on:
  push:
    branches:
      - master
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

env:
  AWS_REGISTRY: public.ecr.aws/genialis
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        image: [fedora-33, ubuntu-20.04, communication]
        include:
          - image: fedora-33
            context: resolwe/toolkit/docker_images/base/
            file: resolwe/toolkit/docker_images/base/Dockerfile.fedora-33
            repository: genialis-test/base
            tags: fedora-33
            release-tag: false
          - image: ubuntu-20.04
            context: resolwe/toolkit/docker_images/base/
            file: resolwe/toolkit/docker_images/base/Dockerfile.ubuntu-20.04
            repository: genialis-test/base
            tags: ubuntu-20.04
            release-tag: true
          - image: communication
            context: resolwe/
            file: resolwe/flow/docker_images/Dockerfile.communication
            repository: genialis-test/com
            tags: latest
            release-tag: true

    steps:
      - uses: actions/checkout@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Public ECR
        uses: docker/login-action@v1
        with:
          registry: public.ecr.aws
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build and push image ${{ matrix.image }}
        uses: docker/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ env.AWS_REGISTRY }}/${{ matrix.repository }}:${{ matrix.tags }}
          push: true

      - name: Get the docker image tag
        if: "startsWith(github.ref, 'refs/tags')"
        id: get_tag
        run: echo ::set-output name=VERSION::${GITHUB_REF#refs/tags/}

      - name: Build and push tagged image
        # When there are multiple versions of the same image matrix.release-tag
        # is used to determine which among them is published with release tag
        if: "startsWith(github.ref, 'refs/tags') && matrix.release-tag"
        uses: docker/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ env.AWS_REGISTRY }}/${{ matrix.repository }}:${{ steps.get_tag.outputs.VERSION }}
          push: true
